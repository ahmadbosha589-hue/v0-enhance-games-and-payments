name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Supply-chain gate: fail on any critical finding. High/moderate are
      # reported but do not block (documented in docs/PRODUCTION-READINESS.md).
      - run: npm audit --audit-level=critical
      # Launch gate in CI mode: missing operator env vars are WARNINGS here
      # (Actions has no secrets); code-level checks still FAIL the build.
      - run: node scripts/verify-launch.mjs --ci
